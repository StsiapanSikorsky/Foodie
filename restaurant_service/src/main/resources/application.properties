spring.application.name=restaurant_service

server.servlet.context-path=/
server.port=8198

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=foodie_restaurants
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=foodie_restaurants

#swagger
swagger.servers.first=http://localhost:8198
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

#MinIO S3
cloud.aws.credentials.access-key=minioadmin
cloud.aws.credentials.secret-key=minioadmin
cloud.aws.region.static=us-east-1
cloud.aws.s3.bucket=foodie-restaurants
cloud.aws.endpoint=http://localhost:9000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

#prometheus settings
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always

#eureka
eureka.client.service-url.defaultZone=http://localhost:8201/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.instance.instance-id=${spring.application.name}:${server.port}

#end points
end.point.restaurant=/restaurant
end.point.id=/{id}
end.point.add=/add
end.point.search=/search

end.point.restaurant.id.tables=/restaurant/{id}/tables
end.point.tableId=/{numberOfTable}

end.point.restaurant.id.images=/restaurant/{id}/images

end.point.booking-integration=/booking-integration
end.point.check.restaurantId.userId.numberOfTable=/check/{restaurantId}/{userId}/{numberOfTable}
end.point.check=/check
end.point.getRestaurantId.ownerId=/getRestaurantId/{ownerId}

auth.service.url=http://localhost:8197