services:

  postgres:
    image: postgres:15-alpine
    container_name: foodie-postgres
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - foodie-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodie-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    volumes:
      - redis-data:/data
    networks:
      - foodie-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: foodie-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    environment:
      MINIO_ROOT_USER: foodie_admin
      MINIO_ROOT_PASSWORD: foodie_admin
      MINIO_DEFAULT_BUCKETS: foodie-images
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - foodie-network
    healthcheck:
      test: ["CMD", "minio", "server", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  discovery-service:
    build:
      context: ../discovery_service
      dockerfile: docker/Dockerfile
    container_name: discovery-service
    ports:
      - "8201:8201"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - foodie-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8201/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    container_name: foodie-prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - foodie-network
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: foodie-grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - foodie-network
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy

  authentication-service:
    build:
      context: ../authentivation_service
      dockerfile: docker/Dockerfile
    container_name: authentication-service
    ports:
      - "8197:8197"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      - DB_HOST=postgres
      - EUREKA_HOST=discovery-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - foodie-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api_gateway
      dockerfile: docker/Dockerfile
    container_name: api-gateway
    ports:
      - "8200:8200"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.15'
          memory: 64M
    environment:
      - EUREKA_HOST=discovery-service
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - foodie-network
    restart: unless-stopped

  booking-service:
    build:
      context: ../booking_service
      dockerfile: docker/Dockerfile
    container_name: booking-service
    ports:
      - "8199:8199"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      - DB_HOST=postgres
      - EUREKA_HOST=discovery-service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - foodie-network
    restart: unless-stopped

  restaurant-service:
    build:
      context: ../restaurant_service
      dockerfile: docker/Dockerfile
    container_name: restaurant-service
    ports:
      - "8198:8198"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      - DB_HOST=postgres
      - EUREKA_HOST=discovery-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - foodie-network
    restart: unless-stopped

networks:
  foodie-network:
    driver: bridge
    enable_ipv6: false

volumes:
  grafana-storage:
  postgres-data:
  redis-data:
  minio-data: