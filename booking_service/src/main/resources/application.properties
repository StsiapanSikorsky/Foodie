spring.application.name=booking_service

server.servlet.context-path=/
server.port=8199

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=foodie_booking
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=foodie_booking

auth.service.url=http://localhost:8197
restaurant.service.url=http://localhost:8198

#swagger
swagger.servers.first=http://localhost:8199
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#prometheus settings
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always

#eureka
eureka.client.service-url.defaultZone=http://localhost:8201/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.instance.instance-id=${spring.application.name}:${server.port}

#end points
end.point.booking=/booking
end.point.userId=/{userId}
end.point.restaurantId=/{restaurantId}
end.point.bookingId=/{bookingId}
end.point.owner=/owner
end.point.user=/user

end.point.booking-integration.check.restaurantId.userId.numberOfTable=/booking-integration/check/{restaurantId}/{userId}/{numberOfTable}
end.point.booking-integration.getRestaurantId.ownerId=/booking-integration/getRestaurantId/{ownerId}
end.point.booking-integration.check=/booking-integration/check