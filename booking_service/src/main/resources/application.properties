spring.application.name=booking_service

server.servlet.context-path=/
server.port=8199

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=foodie_booking
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=foodie_booking

auth.service.url=http://localhost:8197
restaurant.service.url=http://localhost:8198

end.point.booking=/booking
end.point.userId=/{userId}
end.point.restaurantId=/{restaurantId}
end.point.bookingId=/{bookingId}
end.point.owner=/owner
end.point.user=/user