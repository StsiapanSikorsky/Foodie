spring.application.name=authentication-service

server.servlet.path=/
server.port=8197

#jwt
jwt.secret=ZMTqj2ohFF6ZkXdBFd9Q4eW4JFqYCcDQo67LclJTBfZJGDpUOueXGxWiAzjyJ39a3dQwEW706NBnW8ud11wVlw==
jwt.lifetime=120000 


#sql
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=foodie_authentication
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=foodie_authentication

#swagger
swagger.servers.first=http://localhost:8197
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

#prometheus settings
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always

#endpoints authentication
end.point.authentication=/authentication
end.point.user.register=/user/register
end.point.user.login=/user/login
end.point.owner.register=/owner/register
end.point.owner.login=/owner/login
end.point.validate=/validate
end.point.refresh.token=/refresh

#endpoints other
end.point.owner=/owner
end.point.user=/user
end.point.id=/{id}

#eureka
eureka.client.service-url.defaultZone=http://localhost:8201/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.instance.instance-id=${spring.application.name}:${server.port}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
